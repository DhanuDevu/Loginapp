# ─────────────────────────────────────────────
# Server Configuration
# Render injects PORT automatically; fallback 8080 for local
# ─────────────────────────────────────────────
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=reglog-backend

# ─────────────────────────────────────────────
# MySQL Database Configuration
# Local  → set DB_HOST=localhost, DB_PORT=3306, DB_NAME=reglog_db
# Render → set env vars to Aiven values (see Render dashboard)
# ─────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:reglog_db}?useSSL=${DB_USE_SSL:false}&requireSSL=${DB_REQUIRE_SSL:false}&verifyServerCertificate=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────────────────────────────────────────
# JPA & Hibernate Settings
# ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─────────────────────────────────────────────
# JWT Security Configuration
# 256-bit base64/hex secret for HMAC-SHA256
# ─────────────────────────────────────────────
reglog.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Expiration in milliseconds: 24 hours (86,400,000 ms)
reglog.jwt.expiration-ms=86400000

# ─────────────────────────────────────────────
# CORS Configuration
# Add your Vercel URL here once deployed
# ─────────────────────────────────────────────
reglog.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

