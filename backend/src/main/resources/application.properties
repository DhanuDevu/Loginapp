# ─────────────────────────────────────────────
# Server Configuration
# Render injects PORT automatically; fallback 8080 for local
# ─────────────────────────────────────────────
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=reglog-backend

# ─────────────────────────────────────────────
# MySQL Database Configuration
# Local  → set DB_HOST=localhost, DB_PORT=3306, DB_NAME=reglog_db
# Render → set env vars to Aiven values (see Render dashboard)
# Allow full URL override or build from host/port/dbname
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:reglog_db}?sslMode=${DB_SSL_MODE:REQUIRED}&useSSL=${DB_USE_SSL:true}&requireSSL=${DB_REQUIRE_SSL:false}&verifyServerCertificate=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────────────────────────────────────────
# JPA & Hibernate Settings
# ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ─────────────────────────────────────────────
# Performance & Startup Optimizations (for fast boot on cloud tiers)
# ─────────────────────────────────────────────
spring.main.lazy-initialization=true
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# ─────────────────────────────────────────────
# JWT Security Configuration
# 256-bit base64/hex secret for HMAC-SHA256
# ─────────────────────────────────────────────
reglog.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Expiration in milliseconds: 24 hours (86,400,000 ms)
reglog.jwt.expiration-ms=86400000

# ─────────────────────────────────────────────
# CORS Configuration
# Add your Vercel URL here once deployed
# ─────────────────────────────────────────────
reglog.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

